# TODO: fill from guide
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app

      - name: Import check
        run: python -c "from app.main import app; print('backend import OK')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (TypeScript check bhi hota hai)
        run: npm run build

  docker-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start all services
        run: docker compose up -d --build

      - name: Wait for backend aur frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 3
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 3
          done

      - name: Smoke test
        run: |
          curl -sf http://localhost:8000/api/health
          curl -sf http://localhost:8000/api/dashboard
          # frontend ke proxy (/api rewrite) se bhi check
          curl -sf http://localhost:3000/api/dashboard

      - name: Logs dikhao (agar fail hua)
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v